<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc">
  <title id="title">Recommended workflow</title>
  <desc id="desc">A simple, conservative SVG workflow diagram for Codex Session Handoff. It shows four steps: Codex, This tool, Evidence pack, and GPT, followed by ChatGPT usage steps.</desc>

  <rect width="1800" height="720" fill="#F8FAFC"/>

  <!-- Header -->
  <text x="60" y="70" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#0F172A">Recommended workflow</text>
  <text x="60" y="116" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#475569">Generate an evidence pack, upload one Markdown file, then paste the generated prompts into ChatGPT.</text>

  <!-- Card 1 -->
  <rect x="60" y="170" width="340" height="320" rx="26" ry="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
  <circle cx="230" cy="225" r="30" fill="#2F64E5"/>
  <text x="218" y="237" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">1</text>
  <rect x="180" y="280" width="100" height="84" rx="14" ry="14" fill="#EFF6FF" stroke="#2F64E5" stroke-width="5"/>
  <rect x="180" y="280" width="100" height="16" rx="8" ry="8" fill="#2F64E5"/>
  <circle cx="196" cy="288" r="3.5" fill="#FFFFFF"/>
  <circle cx="212" cy="288" r="3.5" fill="#FFFFFF"/>
  <circle cx="228" cy="288" r="3.5" fill="#FFFFFF"/>
  <path d="M204 334 L220 318 L204 302" fill="none" stroke="#2F64E5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="228" y1="334" x2="248" y2="334" stroke="#2F64E5" stroke-width="5" stroke-linecap="round"/>
  <text x="125" y="420" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#0F172A">1. Codex</text>
  <line x1="100" y1="444" x2="360" y2="444" stroke="#CBD5E1" stroke-width="3"/>
  <text x="100" y="486" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">Local JSONL sessions</text>
  <text x="100" y="516" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">stored in ~/.codex/sessions</text>

  <!-- Arrow 1 -->
  <line x1="430" y1="330" x2="520" y2="330" stroke="#2F64E5" stroke-width="10" stroke-linecap="round"/>
  <path d="M492 300 L524 330 L492 360" fill="none" stroke="#2F64E5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card 2 -->
  <rect x="550" y="170" width="340" height="320" rx="26" ry="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
  <circle cx="720" cy="225" r="30" fill="#2F64E5"/>
  <text x="708" y="237" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">2</text>
  <rect x="676" y="282" width="72" height="92" rx="14" ry="14" fill="#ECFDF5" stroke="#159A8C" stroke-width="5"/>
  <line x1="692" y1="312" x2="730" y2="312" stroke="#159A8C" stroke-width="5" stroke-linecap="round"/>
  <line x1="692" y1="336" x2="730" y2="336" stroke="#159A8C" stroke-width="5" stroke-linecap="round"/>
  <circle cx="760" cy="350" r="26" fill="none" stroke="#159A8C" stroke-width="6"/>
  <line x1="778" y1="368" x2="798" y2="388" stroke="#159A8C" stroke-width="6" stroke-linecap="round"/>
  <text x="605" y="420" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#0F172A">2. This tool</text>
  <line x1="590" y1="444" x2="850" y2="444" stroke="#CBD5E1" stroke-width="3"/>
  <text x="604" y="486" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">Scan, redact, rank docs,</text>
  <text x="604" y="516" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">and cluster sessions</text>

  <!-- Arrow 2 -->
  <line x1="920" y1="330" x2="1010" y2="330" stroke="#2F64E5" stroke-width="10" stroke-linecap="round"/>
  <path d="M982 300 L1014 330 L982 360" fill="none" stroke="#2F64E5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card 3 -->
  <rect x="1040" y="170" width="420" height="320" rx="26" ry="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
  <circle cx="1250" cy="225" r="30" fill="#2F64E5"/>
  <text x="1238" y="237" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">3</text>
  <!-- file/folder icon -->
  <path d="M1200 300 H1270 L1290 322 V388 H1188 V312 C1188 305 1193 300 1200 300 Z" fill="#DBEAFE" stroke="#5B9AF5" stroke-width="5"/>
  <path d="M1204 270 H1266 L1284 288 V318 H1204 C1197 318 1192 313 1192 306 V282 C1192 275 1197 270 1204 270 Z" fill="#FFFFFF" stroke="#5B9AF5" stroke-width="5"/>
  <line x1="1212" y1="292" x2="1252" y2="292" stroke="#5B9AF5" stroke-width="5" stroke-linecap="round"/>
  <line x1="1212" y1="308" x2="1248" y2="308" stroke="#5B9AF5" stroke-width="5" stroke-linecap="round"/>
  <line x1="1212" y1="324" x2="1240" y2="324" stroke="#5B9AF5" stroke-width="5" stroke-linecap="round"/>
  <text x="1100" y="420" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#0F172A">3. Evidence pack</text>
  <line x1="1085" y1="444" x2="1415" y2="444" stroke="#CBD5E1" stroke-width="3"/>
  <text x="1085" y="486" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">CHATGPT_HANDOFF_INPUT.md</text>
  <text x="1122" y="516" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">+ NEXT_MESSAGE prompts</text>

  <!-- Arrow 3 -->
  <line x1="1490" y1="330" x2="1580" y2="330" stroke="#2F64E5" stroke-width="10" stroke-linecap="round"/>
  <path d="M1552 300 L1584 330 L1552 360" fill="none" stroke="#2F64E5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card 4 -->
  <rect x="1610" y="170" width="180" height="320" rx="26" ry="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
  <circle cx="1700" cy="225" r="30" fill="#2F64E5"/>
  <text x="1688" y="237" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">4</text>
  <rect x="1648" y="282" width="104" height="104" rx="18" ry="18" fill="#34D3C3"/>
  <circle cx="1700" cy="334" r="33" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <path d="M1684 315 C1696 306 1718 308 1724 326" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <path d="M1680 345 C1688 360 1708 364 1721 355" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <path d="M1719 316 C1730 324 1732 342 1723 353" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <text x="1638" y="420" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#0F172A">4. GPT</text>
  <line x1="1630" y1="444" x2="1770" y2="444" stroke="#CBD5E1" stroke-width="3"/>
  <text x="1640" y="486" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">Phase 1 map</text>
  <text x="1634" y="516" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">Phase 2 report</text>

  <!-- Bottom instructions -->
  <rect x="60" y="560" width="1730" height="110" rx="20" ry="20" fill="#EFF6FF" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="115" cy="615" r="32" fill="#2F64E5"/>
  <path d="M98 602 H126 C134 602 140 608 140 616 V626 C140 634 134 640 126 640 H114 L103 649 V640 H98 C90 640 84 634 84 626 V616 C84 608 90 602 98 602 Z" fill="#FFFFFF"/>
  <circle cx="104" cy="622" r="3" fill="#2F64E5"/>
  <circle cx="113" cy="622" r="3" fill="#2F64E5"/>
  <circle cx="122" cy="622" r="3" fill="#2F64E5"/>
  <text x="170" y="602" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2F64E5">ChatGPT steps</text>
  <text x="170" y="638" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0F172A">Upload CHATGPT_HANDOFF_INPUT.md → paste NEXT_MESSAGE_PHASE1.txt → review and confirm → paste NEXT_MESSAGE_PHASE2.txt → save the final report.</text>
</svg>
