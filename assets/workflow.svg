<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
  <rect width="1400" height="520" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Recommended workflow</text>
  <text x="60" y="100" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#475569">Generate an evidence pack, upload one Markdown file, then paste the generated Phase 1 / Phase 2 prompts into ChatGPT.</text>

  <rect x="70" y="150" width="220" height="150" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="104" y="196" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a">1. Codex</text>
  <text x="104" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Local JSONL sessions</text>
  <text x="104" y="260" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">in ~/.codex/sessions</text>

  <path d="M310 225 H390" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <path d="M378 212 L398 225 L378 238" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="420" y="150" width="240" height="150" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="454" y="196" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a">2. This tool</text>
  <text x="454" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Scan, redact, rank docs</text>
  <text x="454" y="260" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">and cluster sessions</text>

  <path d="M682 225 H762" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <path d="M750 212 L770 225 L750 238" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="790" y="150" width="260" height="150" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="824" y="196" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a">3. Evidence pack</text>
  <text x="824" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">CHATGPT_HANDOFF_INPUT.md</text>
  <text x="824" y="260" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">+ NEXT_MESSAGE prompts</text>

  <path d="M1072 225 H1152" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <path d="M1140 212 L1160 225 L1140 238" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="1180" y="150" width="160" height="150" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="1214" y="196" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a">4. GPT</text>
  <text x="1214" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Phase 1 map</text>
  <text x="1214" y="260" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Phase 2 report</text>

  <rect x="70" y="350" width="1270" height="94" rx="18" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
  <text x="104" y="389" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">ChatGPT steps</text>
  <text x="104" y="424" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">Upload CHATGPT_HANDOFF_INPUT.md → paste NEXT_MESSAGE_PHASE1.txt → review and confirm → paste NEXT_MESSAGE_PHASE2.txt → save the final report.</text>
</svg>
